<script>
/**
 * 报价单「复制为图片」通用实现（Canvas 手绘，无外部依赖）
 * 用法：QuoteShot.copy({ title, blocks, filename, onTip })
 * blocks: {type:'text', text, size, weight, color, lh, strike} | {type:'hr'} | {type:'gap', h}
 */
(function () {
  var FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif';

function wrap(ctx, text, maxW) {
    var lines = [];
    String(text).split('\n').forEach(function (raw) {
      if (raw === '') { lines.push(''); return; }
      var cur = '';
      for (var i = 0; i < raw.length; i++) {
        var ch = raw[i];
        if (ctx.measureText(cur + ch).width > maxW && cur) { lines.push(cur); cur = ch; }
        else { cur += ch; }
      }
      lines.push(cur);
    });
    return lines;
  }

  function draw(opts) {
    var W = opts.width || 750;
    var PAD = 56;
    var innerW = W - PAD * 2;
    var measure = document.createElement('canvas').getContext('2d');
    var rows = [];
    var title = opts.title || '';
    var blocks = opts.blocks || [];

    measure.font = '800 40px ' + FONT;
    var titleLines = wrap(measure, title || ' ', innerW);
    var titleLH = 56;

    blocks.forEach(function (b) {
      if (b.type === 'hr') { rows.push({ type: 'hr' }); return; }
      if (b.type === 'gap') { rows.push({ type: 'gap', h: b.h || 0 }); return; }
      var size = b.size || 29;
      var weight = b.weight || '400';
      var lh = b.lh || Math.round(size * 1.8);
      measure.font = weight + ' ' + size + 'px ' + FONT;
      wrap(measure, b.text, innerW).forEach(function (ln) {
        rows.push({ type: 'text', text: ln, size: size, weight: weight, color: b.color || '#333333', lh: lh, strike: !!b.strike });
      });
    });

    var H = PAD + 10;
    H += titleLines.length * titleLH + 14;
    rows.forEach(function (l) {
      if (l.type === 'hr') H += 2 + 30;
      else if (l.type === 'gap') H += l.h;
      else H += l.lh;
    });
    H += PAD;

    var scale = 2;
    var c = document.createElement('canvas');
    c.width = W * scale;
    c.height = H * scale;
    var ctx = c.getContext('2d');
    ctx.scale(scale, scale);
    ctx.textBaseline = 'alphabetic';

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    var y = PAD + 10;
    ctx.fillStyle = opts.titleColor || '#1B3A5B';
    ctx.font = '800 40px ' + FONT;
    titleLines.forEach(function (ln) {
      ctx.fillText(ln, PAD, y + 40);
      y += titleLH;
    });

    y += 14;
    ctx.fillRect(PAD, y, 240, 3);
    y += 12;

    rows.forEach(function (l) {
      if (l.type === 'hr') {
        ctx.fillStyle = opts.hrColor || '#1B3A5B';
        ctx.fillRect(PAD, y + 12, 240, 3);
        y += 3 + 26;
        return;
      }
      if (l.type === 'gap') { y += l.h; return; }
      ctx.fillStyle = l.color;
      ctx.font = l.weight + ' ' + l.size + 'px ' + FONT;
      var baseY = y + l.lh / 2 + l.size * 0.36;
      ctx.fillText(l.text, PAD, baseY);
      if (l.strike) {
        var w = ctx.measureText(l.text).width;
        ctx.fillRect(PAD, baseY - l.size * 0.3, w, Math.max(1.5, l.size * 0.055));
      }
      y += l.lh;
    });

    return c;
  }

  function toBlob(canvas) {
    return new Promise(function (resolve) {
      if (canvas.toBlob) canvas.toBlob(resolve, 'image/png');
      else resolve(null);
    });
  }


  window.QuoteShot = {
    copy: function (opts) {
      var tip = opts.onTip || function () {};
      var name = opts.filename || '报价单';
      var canvas = draw(opts);
      toBlob(canvas).then(function (blob) {
        if (!blob) { tip('图片生成失败，请改用复制文本', false); return; }


        // 直接复制图片到剪贴板
        if (navigator.clipboard && window.ClipboardItem && navigator.clipboard.write) {
          navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function () {
            tip('报价已复制，可以手机截图或者粘贴发送', true);
          }, function () {
            tip('当前环境不支持复制图片，请改用复制文本', false);
          });
        } else {
          tip('当前环境不支持复制图片，请改用复制文本', false);
        }
      });
    }
  };

})();



</script><!--pnid:PNTmZylerZhJgC7yxsQfw7-->

            align-items: center;
            justify-content: flex-start;
            padding: 14px 18px;
            border: 1.5px solid #e8e8e8;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .module-item:hover { border-color: #bae7ff; }
        .module-item.selected {
            background: #e6f7ff;
            border-color: #1890ff;
        }
        .module-item::before {
            content: '';
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            margin-right: 10px;
            flex-shrink: 0;
            border: 1.5px solid #d9d9d9;
            border-radius: 4px;
            background: #fff;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            box-sizing: border-box;
        }
        .module-item.selected::before {
            content: '✓';
            background: #1890ff;
            border-color: #1890ff;
        }
        .module-item.disabled::before {
            background: #f5f5f5;
            border-color: #f0f0f0;
        }
        .module-info { display: flex; align-items: center; gap: 10px; }
        .module-name { font-size: 18px; font-weight: 500; }
        .module-desc { font-size: 14px; color: #999; margin-top: 3px; }
        .module-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            white-space: nowrap;
            margin-left: 10px;
        }
        .tag-add { background: #e6fffb; color: #13c2c2; border: 1px solid #87e8de; }

        .module-item.disabled {
            opacity: 0.45;
            cursor: not-allowed;
            background: #fafafa;
            border-style: dashed;
        }
        .module-item.disabled:hover { border-color: #e8e8e8; }
        .module-lock { font-size: 12px; color: #fa541c; margin-top: 4px; }

        /* 右侧面板 */
        .summary-panel { position: sticky; top: 20px; }
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 14px 0;
            border-bottom: 1px dashed #f0f0f0;
            font-size: 18px;
        }
        .price-row:last-of-type { border-bottom: none; }
        .price-row .label { color: #666; }
        .price-row .value { font-weight: 500; color: #333; }
        .total-section {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 2px solid #f0f0f0;
        }
        .total-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .total-label { font-size: 19px; color: #666; }
        .total-original { font-size: 20px; color: #999; }
        .right-group { display: flex; align-items: baseline; gap: 8px; }
        .total-price {
            font-size: 48px;
            font-weight: 700;
            color: #f5222d;
        }
        .total-price .unit { font-size: 20px; font-weight: 600; }
        .save-note {
            font-size: 15px;
            color: #52c41a;
            text-align: right;
            margin-top: 8px;
            min-height: 18px;
            font-weight: 500;
        }

        .buy-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #1890ff, #096dd9);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 21px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.25s ease;
            letter-spacing: 2px;
        }
        .buy-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(24,144,255,0.35);
        }

        /* 底部说明 */
        .footer-note {
            max-width: 1200px;
            margin: 0 auto 30px;
            padding: 0 20px;
            text-align: center;
            font-size: 15px;
            color: #bbb;
            line-height: 1.9;
        }
        .footer-wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .qr-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 16px;
            background: #fff;
            border: 1px solid #eef0f3;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            margin-bottom: 16px;
        }
        .qr-img {
            width: 155px;
            height: 155px;
            display: block;
            border-radius: 6px;
        }
        .qr-tip {
            font-size: 15px;
            color: #1890ff;
            font-weight: 600;
            text-align: center;
        }

        /* 复制成功提示 toast */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 96px;
            transform: translateX(-50%) translateY(20px);
            background: #2DB72D;
            color: #fff;
            font-size: 16px;
            padding: 12px 24px;
            border-radius: 24px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 移动端底部价格栏（默认隐藏，仅移动端且配置完成后显示） */
        .mobile-price-bar {
            display: none;
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 200;
            background: #fff;
            border-top: 1px solid #e8e8e8;
            box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
            padding: 10px 16px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            align-items: center;
            justify-content: space-between;
        }
        .mobile-price-bar .mp-left {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .mobile-price-bar .mp-label {
            font-size: 14px;
            color: #999;
        }
        .mobile-price-bar .mp-price {
            font-size: 26px;
            font-weight: 700;
            color: #1890ff;
            line-height: 1;
        }
        .mobile-price-bar .mp-orig {
            font-size: 13px;
            color: #bbb;
            text-decoration: line-through;
            margin-left: 4px;
            display: none;
        }
        .mobile-price-bar .mp-btn {
            display: inline-block;
            background: #1890ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 22px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            pointer-events: auto;
        }

        @media (max-width: 850px) {
            .container { grid-template-columns: 1fr; gap: 20px; padding: 0 16px; margin: 20px auto; }
            .summary-panel { position: static; }
            .header { padding: 18px 20px; }
            .header h1 { font-size: 26px; }
            .config-label { font-size: 18px; }
            .option-btn { font-size: 15px; padding: 10px 18px; }
            .module-name { font-size: 17px; }
            .price-row { font-size: 16px; }
            .total-price { font-size: 38px; }
            .buy-btn { font-size: 19px; }
            /* 移动端：底部价格栏 */
            .mobile-price-bar.show { display: flex; }
            /* 底部栏不遮挡页脚内容 */
            body { padding-bottom: 70px; }
            /* 手机端按钮改用网格，避免被切 */
            body { overflow-x: hidden; }
            .container { padding: 0 12px; }
            .panel { overflow: visible; }
            .panel-body { padding: 16px; }
            .option-group { display: grid; grid-template-columns: repeat(2, calc(50% - 4px)); gap: 8px; justify-content: center; }
            .option-btn { width: 100%; min-width: 0; text-align: center; padding: 10px 4px; font-size: 14px; }
        }
        /* 报价单预览弹窗 */
    .qm-mask { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 999; padding: 16px; }
    .qm-mask.show { display: flex; }
    .qm-card { background: #fff; border-radius: 16px; width: 100%; max-width: 360px; max-height: 84vh; overflow: auto; box-shadow: 0 12px 40px rgba(0,0,0,.28); animation: qmIn .18s ease; }
    @keyframes qmIn { from { transform: translateY(12px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
    .qm-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 10px; }
    .qm-title { font-size: 22px; font-weight: 800; color: #1B3A5B; letter-spacing: .5px; }
    .qm-close { border: none; background: transparent; font-size: 26px; line-height: 1; color: #999; cursor: pointer; padding: 0 4px; }
    .qm-body { padding: 4px 18px 8px; font-size: 15px; line-height: 1.95; color: #333; white-space: pre-wrap; }
    .qm-body .qm-h { font-weight: 700; color: #1B3A5B; }
    .qm-body .qm-hr { height: 1px; background: #eef2f7; margin: 8px 0; }
    .qm-actions { padding: 10px 18px 18px; display: flex; gap: 8px; flex-wrap: wrap; }
    .qm-btn { flex: 1 1 0; min-width: 0; border: none; border-radius: 10px; padding: 12px 8px; font-size: 16px; font-weight: 700; color: #fff; background: linear-gradient(135deg,#1B3A5B,#0096F2); cursor: pointer; white-space: nowrap; }
    .qm-btn.ghost { background: #eef2f7; color: #1B3A5B; }
    @media (max-width: 380px) {
      .qm-card { max-width: 100%; max-height: 88vh; border-radius: 14px; }
      .qm-title { font-size: 18px; }
      .qm-body { font-size: 14px; padding: 4px 14px 8px; }
      .qm-actions { padding: 8px 14px 14px; }
      .qm-btn { font-size: 15px; padding: 11px 6px; }
    }

&lt;div class=&quot;mobile-price-bar show&quot; id=&quot;mobilePriceBar&quot;&gt;
    &lt;div class=&quot;mp-left&quot;&gt;
        &lt;span class=&quot;mp-label&quot;&gt;最终价&lt;/span&gt;
        &lt;span class=&quot;mp-price&quot;&gt;¥&lt;span id=&quot;mpPrice&quot;&gt;3505&lt;/span&gt;&lt;/span&gt;
        &lt;span class=&quot;mp-orig&quot; id=&quot;mpOrig&quot; style=&quot;display: inline;&quot;&gt;原价 ¥3894&lt;/span&gt;
    &lt;/div&gt;
    &lt;button class=&quot;mp-btn&quot; onclick=&quot;copyQuote()&quot;&gt;点我看报价单&lt;/button&gt;
&lt;/div&gt;

&lt;script&gt;
// ========== 定价数据（官方价目表） ==========
const PRICING = {
    // 精确价格表：priceMatrix[账套数][用户数] = 年费（元/年，仅财务模块）
    priceMatrix: {
        '3':  { 1:798, 2:1298, 3:1698, 4:2098, 5:2498, 6:2880, 7:3280, 8:3680, 9:4080, 10:4480 },
        '10': { 1:998, 2:1498, 3:1898, 4:2298, 5:2698, 6:3080, 7:3480, 8:3880, 9:4280, 10:4680 },
        '20': { 1:1298, 2:1798, 3:2198, 4:2598, 5:2998, 6:3380, 7:3780, 8:4180, 9:4580, 10:4980 },
    },

    // 年限折扣
    yearDiscount: { 1: 1, 3: 0.90, 5: 0.80 },

    // 模块定义
    modules: [
        { id: 'accounting', name: '财务模块', desc: '总账，报表，固定资产，出纳，结账', tag: 'add', tagText: '可选', price: 0 },
        { id: 'tax', name: '智能取票', desc: '直连电子税局提取发票', tag: 'add', tagText: '可选', price: 0, pricePerAccount: 198 },
    ]
};

// ========== 状态（默认预填：3账套/1用户/5年，财务模块默认勾选） ==========
let state = {
    users: 1,
    years: 5,
    accounts: '3',
    selectedModules: ['accounting']   // 默认勾选财务模块
};

// ========== 初始化 ==========
function init() {
    renderUserOptions();
    renderYearOptions();
    renderAccountOptions();
    renderModules();
    updatePrice();
}

function renderUserOptions() {
    const container = document.getElementById('userOptions');
    container.innerHTML = '';
    for (let i = 1; i &lt;= 10; i++) {
        const btn = document.createElement('button');
        btn.className = 'option-btn' + (i === state.users ? ' active' : '');
        btn.textContent = i + '用户';
        btn.onclick = () =&gt; selectOption('users', i, container, btn);
        container.appendChild(btn);
    }
}

function renderYearOptions() {
    const container = document.getElementById('yearOptions');
    container.innerHTML = '';
    // 可选年限：1年(无折扣)、3年(9折/省10%)、5年(8折/省20%)
    const yearList = [1, 3, 5];
    yearList.forEach(y =&gt; {
        const btn = document.createElement('button');
        btn.className = 'option-btn' + (y === state.years ? ' active' : '');
        let label = y + '年';
        const disc = PRICING.yearDiscount[y];
        if (disc &lt; 1) {
            // 统一使用全角括号，与「1年（无折扣）」保持一致
            label += '（' + Math.round(disc * 10) + '折·省' + Math.round((1 - disc) * 100) + '%）';
        } else {
            label += '（无折扣）';
        }
        btn.textContent = label;
        btn.onclick = () =&gt; selectOption('years', y, container, btn);
        container.appendChild(btn);
    });
}

function renderAccountOptions() {
    const container = document.getElementById('accountOptions');
    container.innerHTML = '';
    ['3', '10', '20'].forEach(acc =&gt; {
        const btn = document.createElement('button');
        btn.className = 'option-btn' + (acc === state.accounts ? ' active' : '');
        btn.textContent = acc + '账套';
        btn.onclick = () =&gt; selectOption('accounts', acc, container, btn);
        container.appendChild(btn);
    });
}

function renderModules() {
    const container = document.getElementById('moduleList');
    container.innerHTML = '';
    PRICING.modules.forEach(mod =&gt; {
        const isSelected = state.selectedModules.includes(mod.id);
        // 智能取票依赖财务模块：财务模块未勾选时禁用，不可单独选择
        const locked = (mod.id === 'tax' &amp;&amp; !state.selectedModules.includes('accounting'));
        const item = document.createElement('div');
        item.className = 'module-item' + (isSelected ? ' selected' : '') + (locked ? ' disabled' : '');

        const tagClass = 'tag-' + mod.tag;
        const lockHint = locked ? '&lt;div class=&quot;module-lock&quot;&gt;⚠️ 需先勾选财务模块&lt;/div&gt;' : '';

        item.innerHTML = `
            &lt;div class=&quot;module-info&quot;&gt;
                &lt;div&gt;
                    &lt;div class=&quot;module-name&quot;&gt;${mod.name}&lt;/div&gt;
                    &lt;div class=&quot;module-desc&quot;&gt;${mod.desc}&lt;/div&gt;
                    ${lockHint}
                &lt;/div&gt;
            &lt;/div&gt;
            ${mod.id !== 'accounting' ? `&lt;span class=&quot;module-tag ${tagClass}&quot;&gt;${mod.tagText}&lt;/span&gt;` : ''}
        `;
        item.onclick = locked ? null : () =&gt; toggleModule(mod.id);
        container.appendChild(item);
    });
}

function selectOption(key, value, container, btn) {
    // 点击已选中的项 → 取消选择（回到未选状态，触发清零）
    if (state[key] === value) {
        state[key] = null;
        container.querySelectorAll('.option-btn').forEach(b =&gt; b.classList.remove('active'));
    } else {
        state[key] = value;
        container.querySelectorAll('.option-btn').forEach(b =&gt; b.classList.remove('active'));
        btn.classList.add('active');
    }
    updatePrice();
}

function toggleModule(modId) {
    const mod = PRICING.modules.find(m =&gt; m.id === modId);

    const idx = state.selectedModules.indexOf(modId);
    if (idx &gt;= 0) {
        state.selectedModules.splice(idx, 1);
        // 取消财务模块时，自动取消依赖它的智能取票
        if (modId === 'accounting') {
            const taxIdx = state.selectedModules.indexOf('tax');
            if (taxIdx &gt;= 0) state.selectedModules.splice(taxIdx, 1);
        }
    } else {
        // 智能取票依赖财务模块，未勾选财务模块时禁止选择
        if (mod.id === 'tax' &amp;&amp; !state.selectedModules.includes('accounting')) return;
        state.selectedModules.push(modId);
    }
    renderModules();
    updatePrice();
}

// ========== 价格计算 ==========
function calculatePrice() {
    // 完整性校验：账套数 / 用户数 / 使用年限 / 模块 任一未选 → 价格清零
    const incomplete = !state.accounts || !state.users || !state.years || state.selectedModules.length === 0;
    if (incomplete) {
        return { base: 0, listPrice: 0, originalTotal: 0, finalTotal: 0, discount: 1, incomplete: true };
    }

    // 1. 取上传价目表的官方价（财务模块年费）
    const listPrice = PRICING.priceMatrix[state.accounts][state.users];

    // 2. 模块加价（智能取票：198元/账套/年）
    let moduleTotal = 0;
    PRICING.modules.forEach(mod =&gt; {
        if (state.selectedModules.includes(mod.id)) {
            if (mod.pricePerAccount) {
                moduleTotal += mod.pricePerAccount * parseInt(state.accounts, 10);
            } else {
                moduleTotal += mod.price || 0;
            }
        }
    });

    // 3. 年费小计 = 官方价 + 模块年费
    const annualFee = listPrice + moduleTotal;

    // 4. 原价 = (官方价 + 模块) × 年数（含模块的总原价）
    const originalTotal = annualFee * state.years;

    // 5. 折后价 = 原价 × 年限折扣（恒 ≤ 原价）
    const discount = PRICING.yearDiscount[state.years];
    const finalTotal = Math.round(originalTotal * discount);

    return { base: annualFee, listPrice, originalTotal, finalTotal, discount };
}

function updatePrice() {
    const result = calculatePrice();

    // 更新显示（未选维度显示「请选择」）
    document.getElementById('dispAccounts').textContent = state.accounts ? state.accounts + '账套' : '请选择';

    document.getElementById('finalPrice').textContent = result.finalTotal;
    document.getElementById('origPrice').textContent = result.originalTotal;

    // 移动端底部价格栏：配置完整且价格 &gt; 0 时才显示

}

/**
 * 报价单「复制为图片」通用实现（Canvas 手绘，无外部依赖）
 * 用法：QuoteShot.copy({ title, blocks, filename, onTip })
 * blocks: {type:'text', text, size, weight, color, lh, strike} | {type:'hr'} | {type:'gap', h}
 */
(function () {
  var FONT = '&quot;PingFang SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,&quot;Segoe UI&quot;,sans-serif';

function wrap(ctx, text, maxW) {
    var lines = [];
    String(text).split('\n').forEach(function (raw) {
      if (raw === '') { lines.push(''); return; }
      var cur = '';
      for (var i = 0; i &lt; raw.length; i++) {
        var ch = raw[i];
        if (ctx.measureText(cur + ch).width &gt; maxW &amp;&amp; cur) { lines.push(cur); cur = ch; }
        else { cur += ch; }
      }
      lines.push(cur);
    });
    return lines;
  }

  function draw(opts) {
    var W = opts.width || 750;
    var PAD = 56;
    var innerW = W - PAD * 2;
    var measure = document.createElement('canvas').getContext('2d');
    var rows = [];
    var title = opts.title || '';
    var blocks = opts.blocks || [];

    measure.font = '800 40px ' + FONT;
    var titleLines = wrap(measure, title || ' ', innerW);
    var titleLH = 56;

    blocks.forEach(function (b) {
      if (b.type === 'hr') { rows.push({ type: 'hr' }); return; }
      if (b.type === 'gap') { rows.push({ type: 'gap', h: b.h || 0 }); return; }
      var size = b.size || 29;
      var weight = b.weight || '400';
      var lh = b.lh || Math.round(size * 1.8);
      measure.font = weight + ' ' + size + 'px ' + FONT;
      wrap(measure, b.text, innerW).forEach(function (ln) {
        rows.push({ type: 'text', text: ln, size: size, weight: weight, color: b.color || '#333333', lh: lh, strike: !!b.strike });
      });
    });

    var H = PAD + 10;
    H += titleLines.length * titleLH + 14;
    rows.forEach(function (l) {
      if (l.type === 'hr') H += 2 + 30;
      else if (l.type === 'gap') H += l.h;
      else H += l.lh;
    });
    H += PAD;

    var scale = 2;
    var c = document.createElement('canvas');
    c.width = W * scale;
    c.height = H * scale;
    var ctx = c.getContext('2d');
    ctx.scale(scale, scale);
    ctx.textBaseline = 'alphabetic';

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    var y = PAD + 10;
    ctx.fillStyle = opts.titleColor || '#1B3A5B';
    ctx.font = '800 40px ' + FONT;
    titleLines.forEach(function (ln) {
      ctx.fillText(ln, PAD, y + 40);
      y += titleLH;
    });

    y += 14;
    ctx.fillRect(PAD, y, 240, 3);
    y += 12;

    rows.forEach(function (l) {
      if (l.type === 'hr') {
        ctx.fillStyle = opts.hrColor || '#1B3A5B';
        ctx.fillRect(PAD, y + 12, 240, 3);
        y += 3 + 26;
        return;
      }
      if (l.type === 'gap') { y += l.h; return; }
      ctx.fillStyle = l.color;
      ctx.font = l.weight + ' ' + l.size + 'px ' + FONT;
      var baseY = y + l.lh / 2 + l.size * 0.36;
      ctx.fillText(l.text, PAD, baseY);
      if (l.strike) {
        var w = ctx.measureText(l.text).width;
        ctx.fillRect(PAD, baseY - l.size * 0.3, w, Math.max(1.5, l.size * 0.055));
      }
      y += l.lh;
    });

    return c;
  }

  function toBlob(canvas) {
    return new Promise(function (resolve) {
      if (canvas.toBlob) canvas.toBlob(resolve, 'image/png');
      else resolve(null);
    });
  }


  window.QuoteShot = {
    copy: function (opts) {
      var tip = opts.onTip || function () {};
      var name = opts.filename || '报价单';
      var canvas = draw(opts);
      toBlob(canvas).then(function (blob) {
        if (!blob) { tip('图片生成失败，请改用复制文本', false); return; }


        // 直接复制图片到剪贴板
        if (navigator.clipboard &amp;&amp; window.ClipboardItem &amp;&amp; navigator.clipboard.write) {
          navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function () {
            tip('报价已复制，可以手机截图或者粘贴发送', true);
          }, function () {
            tip('当前环境不支持复制图片，请改用复制文本', false);
          });
        } else {
          tip('当前环境不支持复制图片，请改用复制文本', false);
        }
      });
    }
  };

})();

/* Info Note */
.note {
  background: #FFF7E6;
  border: 1px solid #FFE58F;
  border-radius: var(--rs);
  padding: 14px 18px;
  font-size: 15px;
  color: #8C6A1A;
  margin-bottom: 16px;
  line-height: 1.7;
}

/* Summary */
.sum {
  background: #fff;
  border-radius: var(--r);
  box-shadow: var(--sh-lg);
  overflow: hidden;
}
.sum-hdr {
  background: linear-gradient(135deg, var(--dark) 0%, var(--blue) 100%);
  color: #fff;
  padding: 22px 26px;
}
.sum-hdr h3 { font-size: 22px; font-weight: 700; }
.sum-hdr p { font-size: 14px; opacity: 0.8; margin-top: 4px; }
.sum-body { padding: 22px 26px; }

.sum-meta {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 13px; color: var(--t3); margin-bottom: 12px; gap: 8px; flex-wrap: wrap;
}
.plan-no { font-weight: 700; color: var(--dark); }

.s-line {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 8px 0;
  font-size: 16px;
}
.s-line .sl { color: var(--t2); }
.s-line .sv { font-weight: 600; text-align: right; }
.s-line .sv sm { font-size: 14px; font-weight: 400; color: var(--t3); }
.s-div { height: 1px; background: var(--bd); margin: 10px 0; }

.s-total {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 0 6px;
}
.s-total .tl { font-size: 18px; font-weight: 700; }
.s-total .tp { font-size: 36px; font-weight: 800; color: var(--blue); }
.s-total .tp sm { font-size: 16px; font-weight: 400; }

.s-save {
  text-align: right; font-size: 15px; color: var(--orange);
  margin-bottom: 14px;
}

.s-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.btn {
  padding: 15px 20px;
  border: none; border-radius: var(--rs);
  font-size: 17px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
  text-align: center;
}
.btn-p { background: var(--blue); color: #fff; }
.btn-p:hover { background: #0079CC; }
.btn-o { background: #fff; color: var(--blue); border: 2px solid var(--blue); }
.btn-o:hover { background: var(--light); }
.btn-sm { padding: 11px 14px; font-size: 15px; }
.btn-ghost {
  background: none; border: none;
  color: var(--t3); font-size: 14px; cursor: pointer;
  text-decoration: underline;
}
.btn-ghost:hover { color: var(--orange); }


/* Contact Form */
.cform { display: none; margin-top: 16px; }
.cform.on { display: block; }
.fg { margin-bottom: 12px; }
.fg label { display: block; font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.fg input, .fg textarea {
  width: 100%; padding: 10px 14px;
  border: 1px solid var(--bd);
  border-radius: var(--rs);
  font-size: 16px; outline: none;
  transition: border-color 0.2s;
}
.fg input:focus, .fg textarea:focus { border-color: var(--blue); }
.fg textarea { resize: vertical; min-height: 70px; }

/* Disclaimer */
.disc {
  font-size: 14px; color: var(--t3);
  text-align: center; padding: 20px;
  line-height: 1.8;
}

/* 页脚二维码卡片（与金蝶精斗云一致） */
.footer-wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.qr-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 16px;
    background: #fff;
    border: 1px solid #eef0f3;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.05);
    margin-bottom: 16px;
}
.qr-img {
    width: 155px;
    height: 155px;
    display: block;
    border-radius: 6px;
}
.qr-tip {
    font-size: 15px;
    color: #1890ff;
    font-weight: 600;
    text-align: center;
}

/* QR placeholder */
.qr-ph {
  width: 120px; height: 120px; margin: 0 auto;
  border: 1px dashed #C9D4E0; border-radius: 8px;
  background: #FAFBFC;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.qr-ph-t { font-size: 14px; font-weight: 700; color: var(--dark); }
.qr-ph-s { font-size: 11px; color: var(--t3); line-height: 1.5; text-align: center; padding: 0 8px; }

/* Toast */
.toast {
  position: fixed; bottom: 40px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--dark); color: #fff;
  padding: 14px 28px;
  border-radius: var(--rs);
  font-size: 16px; font-weight: 600;
  box-shadow: var(--sh-lg);
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.ok { background: var(--green); }

/* Price Table */
.ptable {
  width: 100%;
  border-collapse: collapse;
  font-size: 15px;
  margin-top: 8px;
}
.ptable th, .ptable td {
  border: 1px solid var(--bd);
  padding: 10px 12px;
  text-align: center;
}
.ptable th {
  background: var(--light);
  color: var(--dark);
  font-weight: 700;
}
.ptable .hl { color: var(--blue); font-weight: 700; }

/* Mobile sticky bar */
.mbar {
  display: none;
  position: fixed; left: 0; right: 0; bottom: 0;
  background: #fff; border-top: 1px solid var(--bd);
  box-shadow: 0 -2px 12px rgba(0,0,0,0.1);
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  z-index: 900;
  align-items: center; gap: 12px;
}
.mbar .mp { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px; }
.mbar .mp .ml { font-size: 14px; color: #999; line-height: 1.3; }
.mbar .mp .mv { font-size: 24px; font-weight: 800; color: var(--blue); line-height: 1; }
.mbar .mp .mo { font-size: 13px; color: #bbb; text-decoration: line-through; white-space: nowrap; }
.mbar .mb { padding: 11px 16px; font-size: 15px; flex-shrink: 0; }

/* Responsive */
@media (max-width: 900px) {
  .body-wrap { flex-direction: column; }
  .right { width: 100%; position: static; }
  /* 版本卡片保持三列并列，仅压缩尺寸以适配窄屏 */
  .ver-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ver { padding: 14px 6px; border-width: 1.5px; }
  .ver .vn { font-size: 14px; line-height: 1.3; }
  .ver .vp { font-size: 19px; margin: 6px 0 4px; }
  .ver .vp sm { font-size: 11px; }
  .ver .vd { font-size: 11px; line-height: 1.45; }
  .ver .vtag { font-size: 10px; padding: 2px 8px; top: -9px; border-radius: 8px; }
  .usr-grid { flex-direction: column; }
  /* 用户数 / 账套数卡片窄屏进一步压缩 */
  .user-acct-grid { gap: 10px; }
  .user-acct-grid .card { padding: 16px 14px; margin-bottom: 10px; }
  .user-acct-grid .card-title { font-size: 16px; }
  .user-acct-grid .card-desc { font-size: 12.5px; margin-bottom: 10px; }
  .user-acct-grid .stepper button { width: 32px !important; height: 36px !important; font-size: 19px !important; }
  .user-acct-grid .stepper input { height: 36px !important; font-size: 15px !important; }
  /* 模块卡片窄屏改为两列并排 */
  .mod-grid { grid-template-columns: repeat(2, 1fr); }
  /* 年限选项保持横向并列，仅压缩尺寸以适配窄屏 */
  .yr-grid { flex-direction: row; gap: 8px; }
  .yr { padding: 12px 5px; border-width: 1.5px; }
  .yr .yn { font-size: 17px; }
  .yr .yd { font-size: 11px; margin-top: 3px; line-height: 1.35; }
  .mbar { display: flex; }
  body { padding-bottom: 78px; }
}
@media (max-width: 400px) {
  .mbar .mv { font-size: 19px; }
  .mbar .mb { padding: 10px 12px; }
  .addon { padding: 10px 10px !important; }
  .addon .stepper button { width: 26px !important; }
  .addon .stepper input { width: 34px !important; height: 34px !important; font-size: 15px !important; }
  .addon .stepper button { height: 34px !important; }
}
@media (max-width: 600px) {
  .hdr h1 { font-size: 24px; }
  .wrap { padding: 0 12px; }
  .card { padding: 18px; }
  .addon { padding: 12px 12px !important; }
  .addon &gt; div:last-child { flex-wrap: wrap !important; row-gap: 8px !important; }
  .addon .an, .addon .ad { overflow-wrap: anywhere; }
  .sum-body { padding: 18px; }
  .ptable { font-size: 13px; }
  .ptable th, .ptable td { padding: 8px 6px; }
  .sum-meta { flex-direction: column; align-items: flex-start; }
}

    name: '标准版',
    accounts: 2,
    acctPrice: 500,
    baseUsers: 1,
    userPrice: 600,
    basePrice: 1500,
    desc: '不具备多账套报表汇总'
  },
  professional: {
    name: '专业版',
    accounts: 2,
    acctPrice: 800,
    baseUsers: 2,
    userPrice: 800,
    basePrice: 2800,
    desc: '具备多账套报表汇总'
  },
  flagship: {
    name: '旗舰版',
    accounts: 3,
    acctPrice: 1000,
    baseUsers: 2,
    userPrice: 1000,
    basePrice: 4000,
    desc: '含标准版+专业版所有功能，适合未来需要上进销存的客户'
  }
};

// ===================== 进销存数据（按版本）=====================
const JXC = {
  standard: { basePrice: 1800, baseUsers: 2, userPrice: 800 },
  professional: { basePrice: 3500, baseUsers: 2, userPrice: 800 },
  flagship: { basePrice: 5000, baseUsers: 2, userPrice: 800 }
};

// ===================== 发票提取数据 =====================
// 1000 元 / 账套 / 年（金额 = 账套数 × 1000）
const TAX = {
  pricePerAcct: 1000,  // 每个账套年费
  baseAccts: 1,        // 起步账套数
  maxAccts: 30         // 账套数上限
};

// 勾选发票提取的前提：财务 / 进销存至少选 1 个
function taxPrereqOk() {
  const fin = el('ao-fin') &amp;&amp; el('ao-fin').checked;
  const jxc = el('ao-jxc') &amp;&amp; el('ao-jxc').checked;
  return !!(fin || jxc);
}

// 账套数上限：不可大于所购账套数（同时受模块自身上限约束）
function taxAcctsMax() {
  const bought = parseInt(el('acct-input') &amp;&amp; el('acct-input').value) || 0;
  if (bought &lt;= 0) return TAX.maxAccts;
  return Math.min(TAX.maxAccts, bought);
}

// 统一取当前账套数（含边界夹取：不小于起步值，不大于所购账套数）
function taxAccts() {
  const raw = parseInt(el('tax-acct-input').value) || TAX.baseAccts;
  const max = taxAcctsMax();
  return Math.min(max, Math.max(TAX.baseAccts, raw));
}

// ===================== 费用报销数据 =====================
// 起步价 1200 元/年，含 10 个用户；每多 5 个用户加 300 元；最多 100 个用户
// 仅专业版 / 旗舰版可加选
const EXPENSE = {
  basePrice: 1200,     // 起步价（含 10 个用户）
  baseUsers: 10,       // 起步包含用户数
  stepUsers: 5,        // 每档追加用户数
  stepPrice: 300,      // 每档加价
  maxUsers: 100        // 用户数上限
};

// 费用报销是否对当前版本开放（仅专业版 / 旗舰版）
function expenseAllowed() {
  return S.ver === 'professional' || S.ver === 'flagship';
}

// 勾选费用报销的前提：财务 / 进销存至少选 1 个
function expensePrereqOk() {
  const fin = el('ao-fin') &amp;&amp; el('ao-fin').checked;
  const jxc = el('ao-jxc') &amp;&amp; el('ao-jxc').checked;
  return !!(fin || jxc);
}

// 按用户数计算费用报销年费（用户数自动向上取整到 5 的倍数档位）
function expensePriceOf(users) {
  const u = users || EXPENSE.baseUsers;
  const extraSteps = Math.max(0, Math.ceil((u - EXPENSE.baseUsers) / EXPENSE.stepUsers));
  return EXPENSE.basePrice + extraSteps * EXPENSE.stepPrice;
}

// 统一取当前费用报销用户数（含边界夹取）
function expenseUsers() {
  const raw = parseInt(el('expense-user-input').value) || EXPENSE.baseUsers;
  return Math.min(EXPENSE.maxUsers, Math.max(EXPENSE.baseUsers, raw));

// ===================== 本地存储（带异常保护） =====================
const LS_KEY = { state: 'kd_quote_state_v1', plans: 'kd_quote_plans_v1', seq: 'kd_quote_seq_v1' };
function lsGet(k, def) {
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
}
function lsDel(k) {
  try { localStorage.removeItem(k); } catch (e) {}
}

// ===================== 状态 =====================
let S = {
  ver: null,
  users: 0,
  accounts: 0,
  years: 0,
  discount: 1.0,
  jxc: false,
  fin: false,
  prod: false,
  tax: false,
  taxAccts: 1,
  expense: false,
  expenseUsers: 10,
  lingjiStd: 0,
  lingjiStdYr: 1,
  lingjiPro: 0,
  lingjiProYr: 1,
  lingjiPack: 0
};

// ===================== 工具函数 =====================
function el(id) { return document.getElementById(id); }
function fmt(n) { return Math.round(n).toLocaleString('zh-CN'); }
function pad2(n) { return n &lt; 10 ? '0' + n : '' + n; }
function esc(s) {
  return String(s).replace(/&amp;/g, '&amp;amp;').replace(/&lt;/g, '&amp;lt;').replace(/&gt;/g, '&amp;gt;')
    .replace(/&quot;/g, '&amp;quot;').replace(/'/g, '&amp;#39;');
}
function dcTextOf(dc) { return dc === 0.9 ? '9折' : dc === 0.8 ? '8折' : ''; }
function nowStr() {
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
    ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

// ===================== 选择版本 =====================
function selVer(vEl) {
  // 再次点击已选中的版本 → 保持选中不变（避免误触清空已配置的报价）
  if (S.ver &amp;&amp; vEl.dataset.ver === S.ver) {
    return;
  }
  S.ver = vEl.dataset.ver;
  document.querySelectorAll('#ver-grid .ver').forEach(v =&gt; v.classList.remove('on'));
  vEl.classList.add('on');
  const d = DATA[S.ver];
  // 重置用户数为版本基础值
  S.users = d.baseUsers;
  el('user-input').value = d.baseUsers;
  el('user-input').min = d.baseUsers;
  el('user-desc').textContent = '含' + d.baseUsers + '个用户，可按需增购';
  el('user-price-label').textContent = d.userPrice + '元/年/人';
  // 重置账套数为版本基础值
  S.accounts = d.accounts;
  el('acct-input').value = d.accounts;
  el('acct-input').min = d.accounts;
  el('acct-desc').textContent = '含' + d.accounts + '个账套，可按需增购';
  el('acct-price-label').textContent = d.acctPrice + '元/年/个';
  // 更新模块价格标签
  const j = JXC[S.ver];
  el('jxc-price-label').textContent = j.basePrice + '元/年';
  el('fin-price-label').textContent = d.basePrice + '元/年';
  // 启用模块卡片
  const mc = el('module-card');
  mc.style.opacity = '1';
  mc.style.pointerEvents = 'auto';
  el('module-note').textContent = '财务为版本基础模块（已默认勾选）；可按需加选进销存 / 生产成本 / 发票提取 / 费用报销。';
  document.querySelectorAll('#module-card input[type=&quot;checkbox&quot;]').forEach(cb =&gt; cb.disabled = false);
  // 启用购买年限卡片
  el('year-card').style.opacity = '1';
  el('year-card').style.pointerEvents = 'auto';
  el('year-desc').textContent = '多年购买享折扣优惠';
  // 财务：版本基础模块，默认勾选；其余模块与增值服务保留上一版本的所选状态
  el('ao-fin').checked = true;
  S.fin = true;
  // 发票提取：切换版本时重置（需先选财务 / 进销存，前提校验在 calc 中统一处理）
  if (el('tax-addon')) el('tax-addon').style.display = '';
  syncTaxVersion();
  // 生产成本仅旗舰版可选
  const prodAddon = el('prod-addon');
  const prodCb = el('ao-prod');
  if (S.ver === 'flagship') {
    prodAddon.style.display = '';
    prodCb.disabled = false;
  } else {
    prodAddon.style.display = 'none';
    prodCb.checked = false;
    prodCb.disabled = true;
    S.prod = false;
  }
  // 费用报销：仅专业版 / 旗舰版可选，切换版本时重置
  syncExpenseVersion();
  // 启用灵基点数包步进器与增值服务卡片
  const packRow = el('lingji-pack-row');
  packRow.style.opacity = '1';
  packRow.style.pointerEvents = 'auto';
  const ac = el('addon-card');
  ac.style.opacity = '1';
  ac.style.pointerEvents = 'auto';
  // 默认选中「1年」，避免漏选年限导致算不出总价
  if (!S.years) {
    const y1 = document.querySelector('#yr-grid .yr[data-yr=&quot;1&quot;]');
    if (y1) selYr(y1);
  }
  calc();
}

// ===================== 取消选择版本 =====================
function unselectVersion() {
  S.ver = null;
  document.querySelectorAll('#ver-grid .ver').forEach(v =&gt; v.classList.remove('on'));
  S.fin = false; S.jxc = false; S.prod = false;
  S.tax = false; S.taxAccts = TAX.baseAccts;
  S.expense = false; S.expenseUsers = EXPENSE.baseUsers;
  S.years = 0; S.discount = 1.0;
  S.users = 0; S.accounts = 0;
  el('user-input').value = 1;
  el('user-input').min = 1;
  el('acct-input').value = 2;
  el('acct-input').min = 2;
  // 模块卡片：恢复禁用
  const mc = el('module-card');
  mc.style.opacity = '0.5';
  mc.style.pointerEvents = 'none';
  el('module-note').textContent = '请先选择版本';
  document.querySelectorAll('#module-card input[type=&quot;checkbox&quot;]').forEach(cb =&gt; {
    cb.checked = false;
    cb.disabled = true;
  });
  // 生产模块行隐藏
  el('prod-addon').style.display = 'none';
  // 发票提取行隐藏、勾选清空、账套数复位
  if (el('tax-addon')) el('tax-addon').style.display = 'none';
  el('ao-tax').checked = false;
  el('tax-acct-input').value = TAX.baseAccts;
  el('tax-acct-box').style.display = 'none';
  // 费用报销行隐藏、勾选清空、用户数复位
  el('expense-addon').style.display = 'none';
  el('ao-expense').checked = false;
  el('expense-user-input').value = EXPENSE.baseUsers;
  el('expense-users-box').style.display = 'none';
  // 用户数 / 账套数 / 年限卡片：恢复禁用
  ['user-card', 'acct-card', 'year-card'].forEach(id =&gt; {
    el(id).style.opacity = '0.5';
    el(id).style.pointerEvents = 'none';
  });

// ===================== 统一计算（计算与导出共用） =====================
function compute() {
  const d = DATA[S.ver];
  if (!d) return null;
  const items = [];
  let yrPrice = 0;

  if (S.fin) {
    yrPrice += d.basePrice;
    items.push({ label: '财务', calc: fmt(d.basePrice) + '元/年', amt: d.basePrice });
  }
  if (S.jxc) {
    const j = JXC[S.ver];
    yrPrice += j.basePrice;
    items.push({ label: '进销存', calc: fmt(j.basePrice) + '元/年', amt: j.basePrice });
  }
  if (S.prod &amp;&amp; S.ver === 'flagship') {
    yrPrice += 4000;
    items.push({ label: '生产成本', calc: '4,000元/年', amt: 4000 });
  }
  // 发票提取：1000 元 / 账套 / 年（账套数为该模块独立设置，与「选择账套数」无关）
  let taxAmt = 0;
  let taxAcctsVal = 0;
  if (S.tax) {
    taxAcctsVal = (S.taxAccts || TAX.baseAccts);
    taxAmt = taxAcctsVal * TAX.pricePerAcct;
    yrPrice += taxAmt;
    items.push({
      label: '发票提取',
      calc: taxAcctsVal + '个账套×' + fmt(TAX.pricePerAcct) + '元/年',
      amt: taxAmt
    });
  }
  // 费用报销：仅专业版 / 旗舰版；按用户数分档计价
  let expenseAmt = 0;
  let expenseUsersVal = 0;
  if (S.expense &amp;&amp; expenseAllowed()) {
    expenseUsersVal = expenseUsers();
    expenseAmt = expensePriceOf(expenseUsersVal);
    yrPrice += expenseAmt;
    items.push({
      label: '费用报销',
      calc: fmt(expenseAmt) + '元/年（' + expenseUsersVal + '个用户）',
      amt: expenseAmt
    });
  }
  const extraUsers = Math.max(0, S.users - d.baseUsers);
  if (extraUsers &gt; 0) {
    const f = extraUsers * d.userPrice;
    yrPrice += f;
    items.push({ label: '增购用户', calc: extraUsers + '人×' + fmt(d.userPrice) + '元/年', amt: f });
  }
  const extraAccts = Math.max(0, S.accounts - d.accounts);
  if (extraAccts &gt; 0) {
    const f = extraAccts * d.acctPrice;
    yrPrice += f;
    items.push({ label: '增购账套', calc: extraAccts + '个×' + fmt(d.acctPrice) + '元/年', amt: f });
  }

  const lingjiRows = [];
  let lingjiYr = 0;
  if (S.lingjiStd &gt; 0 &amp;&amp; S.lingjiStdYr &gt; 0) {
    const f = S.lingjiStd * 168 * S.lingjiStdYr;
    lingjiYr += f;
    lingjiRows.push({ label: '金蝶灵基AI标准版', calc: S.lingjiStd + '人×168元×' + S.lingjiStdYr + '年（含1200点/人/年）', amt: f });
  }
  if (S.lingjiPro &gt; 0 &amp;&amp; S.lingjiProYr &gt; 0) {
    const f = S.lingjiPro * 688 * S.lingjiProYr;
    lingjiYr += f;
    lingjiRows.push({ label: '金蝶灵基AI专业版', calc: S.lingjiPro + '人×688元×' + S.lingjiProYr + '年（含6000点/人/年）', amt: f });
  }
  let lingjiPack = 0;
  if (S.lingjiPack &gt; 0) {
    lingjiPack = S.lingjiPack * 1000;
    lingjiRows.push({ label: '灵基点数加点包', calc: S.lingjiPack + '份×1000元（每份含5000点，合计' + fmt(S.lingjiPack * 5000) + '点）', amt: lingjiPack });
  }

  // 实施费规则：
  //   勾选「生产成本」→ 10,000元
  //   否则勾选「进销存」或「费用报销」→ 统一 4,000元
  //   其余情况不产生实施费
  let implFee = 0;
  if (S.prod) {
    implFee = 10000;
  } else if (S.jxc || S.expense) {
    implFee = 4000;
  }

  const orig = yrPrice * S.years;
  const disc = yrPrice * S.years * S.discount;
  const all = disc + lingjiYr + lingjiPack + implFee;
  const saved = Math.round(yrPrice * S.years * (1 - S.discount));
  const dcText = dcTextOf(S.discount);

  return { d, items, yrPrice, lingjiRows, lingjiYr, lingjiPack, implFee, orig, disc, all, saved, dcText, extraUsers, extraAccts, expenseAmt, expenseUsersVal, taxAmt, taxAcctsVal };
}

// ===================== 计算与渲染 =====================
function calc() {
  S.jxc = el('ao-jxc').checked;
  S.fin = el('ao-fin').checked;
  S.prod = el('ao-prod').checked;

  // 发票提取：需已选财务或进销存
  syncTaxPrereq();
  S.tax = !!(el('ao-tax') &amp;&amp; el('ao-tax').checked) &amp;&amp; taxPrereqOk();
  if (!S.tax) el('ao-tax').checked = false;
  el('tax-acct-box').style.display = S.tax ? '' : 'none';
  refreshTaxLabel();

  // 费用报销：仅专业版 / 旗舰版；且需已选财务或进销存
  if (expenseAllowed()) {
    syncExpensePrereq();
    S.expense = el('ao-expense').checked &amp;&amp; expensePrereqOk();
    if (!S.expense) el('ao-expense').checked = false;
  } else {
    S.expense = false;
    el('ao-expense').checked = false;
  }
  el('expense-users-box').style.display = S.expense ? '' : 'none';
  refreshExpenseInput();

  // 生产成本：仅旗舰版且已选进销存时才可勾选
  const prodCb = el('ao-prod');
  if (S.ver === 'flagship' &amp;&amp; S.jxc) {
    prodCb.disabled = false;
  } else {
    prodCb.checked = false;
    prodCb.disabled = true;
    S.prod = false;
  }
  if (!S.ver) {
    el('mbar-label').textContent = '最终价';
    el('mbar-price').textContent = '—';
    el('mbar-orig').style.display = 'none';
    el('s-lines').innerHTML = '&lt;div class=&quot;s-line&quot;&gt;&lt;span class=&quot;sl&quot; style=&quot;color:var(--t3);&quot;&gt;请先选择版本&lt;/span&gt;&lt;span class=&quot;sv&quot;&gt;—&lt;/span&gt;&lt;/div&gt;';
    el('sum-users').textContent = 0;
    el('sum-accts').textContent = 0;
    el('sum-years').textContent = 0;
    el('orig-price').textContent = '—';
    el('disc-price').textContent = '—';
    el('all-price').textContent = '—';
    el('s-save').textContent = '';
    el('lingji-line').style.display = 'none';
    el('impl-line').style.display = 'none';
    el('sum-title').textContent = '报价汇总';
    return;
  }

  // 未选择任何模块时，灵基AI人数与加点包自动清零
  const anyModule = S.fin || S.jxc || S.prod || S.tax || S.expense;
  if (!anyModule) {
    ['lingji-std-input', 'lingji-pro-input', 'pack-input'].forEach(function (id) {
      const inp = el(id);
      if ((parseInt(inp.value) || 0) &gt; 0) { inp.value = 0; }
    });
  }

  // 灵基AI：年限固定 1 年（只能 1 年 1 年购买，不可修改）
  S.lingjiStd = parseInt(el('lingji-std-input').value) || 0;
  S.lingjiStdYr = 1;
  S.lingjiPro = parseInt(el('lingji-pro-input').value) || 0;
  S.lingjiProYr = 1;
  S.lingjiPack = parseInt(el('pack-input').value) || 0;

  const r = compute();
  if (!r) return;
  const d = r.d;
  el('sum-title').textContent = '金蝶AI星辰' + d.name + '报价';

  // ---- 明细行（汇总区）----
  let linesHTML = '';
  if (!S.years) {
    linesHTML = '&lt;div class=&quot;note&quot; style=&quot;margin-bottom:12px;padding:10px 14px;font-size:14px;&quot;&gt;请先选择使用年限，再查看完整报价。&lt;/div&gt;';
  }
  const yearsTxt = S.years &gt; 1 ? ' ×' + S.years + '年' : '';
  const amtTxt = S.years &gt; 0 ? '元' : '元/年';
  r.items.forEach(it =&gt; {
    linesHTML += '&lt;div class=&quot;s-line&quot;&gt;&lt;span class=&quot;sl&quot;&gt;' + it.label + '&lt;br&gt;&lt;sm&gt;' + it.calc + yearsTxt + '&lt;/sm&gt;&lt;/span&gt;' +
      '&lt;span class=&quot;sv&quot;&gt;¥' + fmt(S.years &gt; 0 ? it.amt * S.years : it.amt) + ' &lt;sm&gt;' + amtTxt + '&lt;/sm&gt;&lt;/span&gt;&lt;/div&gt;';
  });
  r.lingjiRows.forEach(it =&gt; {
    linesHTML += '&lt;div class=&quot;s-line&quot;&gt;&lt;span class=&quot;sl&quot;&gt;' + it.label + '&lt;br&gt;&lt;sm&gt;' + it.calc + '&lt;/sm&gt;&lt;/span&gt;' +
      '&lt;span class=&quot;sv&quot;&gt;¥' + fmt(it.amt) + ' &lt;sm&gt;元&lt;/sm&gt;&lt;/span&gt;&lt;/div&gt;';
  });
  el('s-lines').innerHTML = linesHTML || '&lt;div class=&quot;s-line&quot;&gt;&lt;span class=&quot;sl&quot; style=&quot;color:var(--t3);&quot;&gt;未选择任何计费项目&lt;/span&gt;&lt;span class=&quot;sv&quot;&gt;—&lt;/span&gt;&lt;/div&gt;';

  // ---- 汇总数字 ----
  el('sum-users').textContent = S.users;
  el('sum-accts').textContent = S.accounts;
  el('sum-years').textContent = S.years || 0;

  if (S.years &gt; 0) {
    el('orig-price').textContent = fmt(r.orig);
    el('disc-price').textContent = fmt(r.disc);
  } else {
    el('orig-price').textContent = '—';
    el('disc-price').textContent = '—';
  }
  // 有折扣时（如多年 9 折），原价整行画横线置灰
  const origStrike = r.saved &gt; 0;
  const origLineEl = el('orig-price').closest('.s-line');
  el('orig-price').style.textDecoration = origStrike ? 'line-through' : 'none';
  el('orig-price').style.color = origStrike ? 'var(--t3)' : '';
  origLineEl.querySelector('.sl').style.textDecoration = origStrike ? 'line-through' : 'none';
  origLineEl.querySelector('.sl').style.color = origStrike ? 'var(--t3)' : '';
  const totalLabel = '最终价（无隐形费用）';
  el('total-label').textContent = totalLabel;

  let saveInfo = '';
  if (S.years &gt; 1 &amp;&amp; r.saved &gt; 0) {
    saveInfo = '已享' + S.years + '年' + r.dcText + '优惠，节省 ¥' + fmt(r.saved);
  }
  el('s-save').textContent = saveInfo;

  const lingjiSum = r.lingjiYr + r.lingjiPack;
  if (lingjiSum &gt; 0) {
    el('lingji-line').style.display = '';
    el('lingji-price').textContent = fmt(lingjiSum);
  } else {
    el('lingji-line').style.display = 'none';
  }

  if (r.implFee &gt; 0) {
    el('impl-line').style.display = '';
    el('impl-price').textContent = fmt(r.implFee);
  } else {
    el('impl-line').style.display = 'none';
  }

  el('all-price').textContent = S.years &gt; 0 ? fmt(r.all) : '—';
  el('mbar-price').textContent = S.years &gt; 0 ? fmt(r.all) : '—';
  el('mbar-label').textContent = '最终价' + (S.years &gt; 0 ? '' : '（请先选年限）');

function copyText(t) {
  return new Promise(function (resolve, reject) {
    if (navigator.clipboard &amp;&amp; window.isSecureContext) {
      navigator.clipboard.writeText(t).then(resolve, function () { fallbackCopy(t, resolve, reject); });
    } else {
      fallbackCopy(t, resolve, reject);
    }
  });
}
function fallbackCopy(t, resolve, reject) {
  const ta = document.createElement('textarea');
  ta.value = t;
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    resolve();
  } catch (e) {
    reject(e);
  } finally {
    ta.remove();
  }
}

  .sec-title{font-size:23px;font-weight:800;margin:26px 0 12px;color:var(--ink);}
  .sec-title small{font-size:14px;font-weight:400;color:#666;}
  .note{font-size:14px;margin-top:8px;}

  /* 星辰优势清单 */
  .vs{list-style:none;counter-reset:v;margin:0;border:1.5px solid var(--green);border-radius:8px;background:var(--green-bg);padding:4px 0;}
  .vs li{counter-increment:v;display:flex;gap:10px;padding:11px 16px;font-size:16px;color:#1f3d2a;border-bottom:1px dashed #b9d8c4;}
  .vs li:last-child{border-bottom:none;}
  .vs li::before{content:counter(v)&quot;.&quot;;font-weight:800;color:var(--green);flex:0 0 auto;}
  .vs li b{color:var(--green);}

  /* 页脚 */
  .promise{border-top:2px dashed #bbb;margin-top:24px;padding-top:14px;font-size:14.5px;color:#333;}
  .foot{text-align:center;margin-top:14px;font-size:15px;}
  .foot b{font-size:17px;}

  .panel{display:none;}
  .panel.active{display:block;}

  /* ============ 响应式：平板 ============ */
  @media (max-width:768px){
    .page{padding:26px 22px 24px;margin:14px auto;}
  }

  /* ============ 响应式：手机端 ============ */
  @media (max-width:560px){
    .page{padding:20px 14px 22px;margin:0 auto;border-radius:0;width:100%;}
    .sec-title{font-size:18px;}
    .vs li{font-size:13.5px;padding:9px 12px;}
    .promise img{width:130px !important;height:130px !important;}
  }

  @media print{
    .page{box-shadow:none;margin:0;}
    .panel{display:block !important;}
  }
  /* 页脚二维码卡片（与其他页签一致） */
  .footer-wrap{max-width:1200px;margin:0 auto;padding:0 20px 10px;display:flex;flex-direction:column;align-items:center;}
  .qr-box{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;background:#fff;border:1px solid #eef0f3;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.05);margin-bottom:16px;}
  .qr-img{width:155px;height:155px;display:block;border-radius:6px;}
  .qr-tip{font-size:15px;color:#1890ff;font-weight:600;text-align:center;}
&lt;/style&gt;
&lt;/head&gt;

  &lt;!-- 页签 --&gt;
  &lt;section class=&quot;panel active&quot; id=&quot;t2&quot;&gt;
    &lt;div class=&quot;sec-title&quot;&gt;金蝶星辰比精斗云强大的功能&lt;/div&gt;
    &lt;ul class=&quot;vs&quot;&gt;
      &lt;li&gt;凭证容量大&lt;b&gt;（月凭证量超100张建议用星辰）&lt;/b&gt;&lt;/li&gt;
      &lt;li&gt;导出报表快、打印凭证不卡顿&lt;/li&gt;
      &lt;li&gt;操作人性化&lt;b&gt;（模糊查询，列宽自适应）&lt;/b&gt;&lt;/li&gt;
      &lt;li&gt;有外币调汇历史记录表&lt;/li&gt;
      &lt;li&gt;无需反结账就能修改往期凭证摘要信息&lt;/li&gt;
      &lt;li&gt;多账套报表汇总免费&lt;b&gt;（专业版、旗舰版免费）&lt;/b&gt;&lt;/li&gt;
      &lt;li&gt;自定义财务报表免费&lt;/li&gt;
      &lt;li&gt;需要进销存或生产管理直接考虑星辰&lt;/li&gt;
      &lt;li&gt;精斗云适合刚成立的微小企业&lt;/li&gt;
      &lt;li&gt;星辰适合发展中的小微企业&lt;b&gt;（营收500万-3亿）&lt;/b&gt;&lt;/li&gt;
    &lt;/ul&gt;
    &lt;p class=&quot;note&quot; style=&quot;margin-top:10px;&quot;&gt;小结：以上为星辰相对精斗云的增强项，可作为版本之外额外加分项一并考量&lt;/p&gt;

  .vt-root{text-align:center;font-size:18px;font-weight:800;color:var(--green);}
  .vt-stem{width:0;height:34px;border-left:2px solid var(--line);margin:0 auto;}
  .vt-area{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;height:28px;}
  .vt-area&gt;span&gt;i{display:block;width:0;height:26px;border-left:2px solid var(--line);margin:0 auto;}
  .vt-hbar{position:absolute;top:0;left:calc((100% - 28px)/6);width:calc(66.666% + 9.333px);height:0;border-top:2px solid var(--line);}

  .sec-title{font-size:23px;font-weight:800;margin:26px 0 12px;color:var(--ink);}
  .sec-title small{font-size:14px;font-weight:400;color:#666;}

  /* 流程对比 */
  .flow-wrap{display:flex;gap:18px;align-items:stretch;}
  .flow-left{flex:1.05;border:1.5px solid var(--green);border-radius:6px;padding:10px 12px;background:var(--green-bg);}
  .flow-right{flex:1;border:1.5px solid var(--green);border-radius:6px;padding:10px 12px;background:var(--green-bg);}
  .flabel{font-weight:700;font-size:15px;margin-bottom:6px;}
  .chain{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:14.5px;margin:6px 0;}
  .box{border:1.5px solid var(--line);border-radius:5px;padding:6px 11px;white-space:nowrap;}
  .box.g{background:var(--green-bx);color:#fff;border-color:var(--green-bx);font-weight:700;}
  .arrow{font-weight:800;color:#555;margin:0 2px;}
  .note{font-size:14px;margin-top:8px;}
  .note.g{color:var(--green);font-weight:700;}

  /* 模块对比 */
  .mod-wrap{display:flex;gap:14px;}
  .mod{flex:1;border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;font-size:14.5px;}
  .mod h4{margin:0 0 6px;font-size:17px;font-weight:800;text-align:center;}
  .mod .grp{font-weight:700;margin:8px 0 3px;color:#444;}
  .mod ul{list-style:none;margin:0;padding:0;}
  .mod li{padding:2px 0;}
  .mod li.add{border:1.5px solid var(--green-bx);border-radius:4px;background:var(--green-bg);padding:2px 6px;margin:2px 0;font-weight:700;color:var(--green);}

  /* 细节大表 */
  table{border-collapse:collapse;width:100%;font-size:14px;margin-top:4px;}
  th,td{border:1px solid var(--line);padding:5px 7px;text-align:center;}
  thead th{background:#f1f1f1;font-weight:800;}
  td.l{text-align:left;}
  td.area{background:var(--green-bg);font-weight:800;color:var(--green);}
  tr.key td{background:var(--blue-bg);}
  tr.key td.area{background:var(--green-bg);}
  .y{color:var(--green);font-weight:800;}
  .n{color:#d93025;font-weight:800;}

  /* 与精斗云对比 */
  .vs{list-style:none;counter-reset:v;margin:0;border:1.5px solid var(--green);border-radius:8px;background:var(--green-bg);padding:4px 0;}
  .vs li{counter-increment:v;display:flex;gap:10px;padding:11px 16px;font-size:16px;color:#1f3d2a;border-bottom:1px dashed #b9d8c4;}
  .vs li:last-child{border-bottom:none;}
  .vs li::before{content:counter(v)&quot;.&quot;;font-weight:800;color:var(--green);flex:0 0 auto;}
  .vs li b{color:var(--green);}

  /* 底部承诺 */
  .promise{border-top:2px dashed #bbb;margin-top:24px;padding-top:14px;font-size:14.5px;color:#333;}
  .promise .big{font-size:17px;font-weight:800;color:var(--green);}
  .foot{text-align:center;margin-top:14px;font-size:15px;}
  .foot b{font-size:17px;}

  .panel{display:none;}
  .panel.active{display:block;}

  /* 细节表横向滚动，避免窄屏溢出 */
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:4px;}
  .table-scroll table{min-width:600px;}

  /* ============ 响应式：平板 ============ */
  @media (max-width:768px){
    .page{padding:26px 22px 24px;margin:14px auto;}
    .title{font-size:28px;}
  }

  /* ============ 响应式：手机端 ============ */
  @media (max-width:560px){
    .page{padding:20px 14px 22px;margin:0 auto;border-radius:0;width:100%;}
    .title{font-size:24px;letter-spacing:1px;}

    /* 页签等宽一行铺满（手机端不换行） */
    .tabs{display:flex;flex-direction:row;gap:6px;margin:14px 0 18px;border-bottom:none;}
    .tab{flex:1 1 0;min-width:0;padding:12px 6px;font-size:14px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:8px;border-bottom:3px solid transparent;top:0;}

    /* 版本头卡：三列横排 + 树形连线（与电脑端一致） */
    .ver-head{gap:8px;}
    .ver{padding:7px 4px;}
    .ver .name{font-size:15px;}
    .vt-stem{height:26px;}
    .vt-area{height:22px;}
    .vt-area&gt;span&gt;i{height:20px;margin-top:0;}
    .vt-root{font-size:16px;}

    /* 流程两个框竖排 */
    .flow-wrap{flex-direction:column;gap:12px;}

    /* 模块三列：移动端横向并排，可滑动对比 */
    .mod-wrap{flex-direction:row;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:8px;padding-bottom:6px;}
    .mod{flex:0 0 120px;font-size:12.5px;padding:10px 9px;}
    .mod h4{font-size:14px;}

    .sec-title{font-size:18px;}
    .vs li{font-size:13.5px;padding:9px 12px;}

    /* 底部二维码自适应 */
    .promise img{width:130px !important;height:130px !important;}

    /* 细节表：手机端不再横向滚动，关键差异 + 三版本同屏 */
    .table-scroll{overflow:visible;}
    .table-scroll table{min-width:0;table-layout:fixed;font-size:13px;}
    th,td{padding:6px 4px;}
    /* 第一列「差异层面」竖排、收窄 */
    thead tr.h1 th:nth-child(1),td.area{
      width:1.7em;padding:6px 2px;
      writing-mode:vertical-rl;letter-spacing:3px;font-size:12px;
    }
    /* 三版本列等宽收窄 */
    thead th{font-size:12px;}
    thead tr.h2 th{width:48px;white-space:nowrap;}
    td.l{word-break:break-all;}
  }

  @media print{
    .page{box-shadow:none;margin:0;}
    .tabs{display:none;}
    .panel{display:block !important;}
  }
  /* 页脚二维码卡片（与其他页签一致） */
  .footer-wrap{max-width:1200px;margin:0 auto;padding:0 20px 10px;display:flex;flex-direction:column;align-items:center;}
  .qr-box{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;background:#fff;border:1px solid #eef0f3;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.05);margin-bottom:16px;}
  .qr-img{width:155px;height:155px;display:block;border-radius:6px;}
  .qr-tip{font-size:15px;color:#1890ff;font-weight:600;text-align:center;}
&lt;/style&gt;
&lt;/head&gt;

<script>
  var jbCur = 0;
  function jbSwitch(idx) {
    jbCur = idx;
    document.querySelectorAll('.jb-tab').forEach(function(t, i){ t.classList.toggle('active', i === idx); });
    document.querySelectorAll('.jb-frame').forEach(function(f, i){ f.classList.toggle('active', i === idx); });
    var ind = document.querySelector('.jb-indicator');
    if (ind) ind.style.transform = 'translateX(' + (idx * 100) + '%)';
    // 客户已看过区别后，停止呼吸提示，避免干扰
    var hint = document.querySelector('.jb-tab.hint');
    if (hint && idx === 2) hint.classList.remove('hint');
    // 每次切换回到内容顶部，避免看到上一个页签的滚动位置
    var fr = document.getElementById('jb-frame-' + idx);
    if (fr) {
      try { if (fr.contentWindow) fr.contentWindow.scrollTo(0, 0); } catch (e) {}
    }
    updateGuide();
  }
  // 顶部快捷按钮：在精斗云 / 星辰之间一键互切
  function jbSwitchOther() {
    jbSwitch(jbCur === 1 ? 0 : 1);
  }
  // 顶部按钮文案随当前页签变化；差异页不显示
  function updateGuide() {
    var btn = document.getElementById('jbGuide');
    if (!btn) return;
    var tx = btn.querySelector('.jb-guide-tx');
    if (tx) tx.textContent = jbCur === 1 ? '看精斗云' : '看星辰';
    btn.style.display = (jbCur >= 2) ? 'none' : 'inline-flex';
  }
  jbSwitch(1); // 默认定位到星辰报价页签

  // 暴露给各子页（报价弹窗里的「对比另一款」按钮调用）
  window.jbSwitchOther = jbSwitchOther;
  window.jbFrameSwitch = jbSwitch;
</script><!--pnid:ACQfE90ixjqp8lx9Rur3Ew-->


<script type="text/plain" id="p3-html-src">&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;zh-CN&quot;&gt;&lt;head&gt;&lt;meta http-equiv=&quot;Content-Type&quot; content=&quot;text/html; charset=UTF-8&quot;&gt;

&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
&lt;title&gt;金蝶版本对比&lt;/title&gt;
&lt;style&gt;
  :root{
    --ink:#222;
    --green:#1a8a4a;
    --green-bx:#34a853;
    --green-bg:#e6f4ea;
    --blue-bx:#1a73e8;
    --blue-bg:#e8f0fe;
    --line:#333;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#e9e9ec;}
  .page{
    width:840px;max-width:100%;
    margin:0 auto 24px;background-color:#fbfaf6;background-image:radial-gradient(rgba(0,0,0,0.035) 1px, transparent 1px);background-size:18px 18px;
    padding:34px 40px 30px;
    box-shadow:0 2px 14px rgba(0,0,0,.18);
    font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,sans-serif;
    color:var(--ink);line-height:1.5;
    position:relative;
  }
  .hdr{background:linear-gradient(135deg,#1B3A5B 0%,#0096F2 100%);color:#fff;padding:36px 0 32px;text-align:center;}.title{text-align:center;font-size:32px;font-weight:800;letter-spacing:1px;line-height:1.7;margin:0;}

  /* 页签 */
  .tabs{display:flex;gap:8px;margin:18px 0 22px;border-bottom:2px solid #ddd;flex-wrap:wrap;}
  .tab{
    appearance:none;border:none;cursor:pointer;background:transparent;
    font-family:inherit;font-size:17px;font-weight:700;color:#666;
    padding:11px 18px;border-radius:8px 8px 0 0;position:relative;top:2px;
    border-bottom:3px solid transparent;transition:.15s;
  }
  .tab:hover{color:var(--green);background:var(--green-bg);}
  .tab.active{color:var(--green);border-bottom-color:var(--green);}

  .lead{text-align:left;font-size:16px;color:#444;margin:22px 0 26px;line-height:1.7;}
  .lead b{color:var(--green);}

  /* 版本头部 */
  .ver-head{display:flex;justify-content:space-between;gap:14px;margin:0 0 6px;}
  .ver{flex:1;border:1.5px solid var(--line);border-radius:6px;padding:8px 6px;text-align:center;}
  .ver .name{font-size:20px;font-weight:800;}
  /* 版本树形结构：金蝶AI星辰分类 → 三版本（三列网格精确对齐卡片中心） */
  .ver-tree{margin:0 0 10px;}
  .vt-root{text-align:center;font-size:18px;font-weight:800;color:var(--green);}
  .vt-stem{width:0;height:34px;border-left:2px solid var(--line);margin:0 auto;}
  .vt-area{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;height:28px;}
  .vt-area&gt;span&gt;i{display:block;width:0;height:26px;border-left:2px solid var(--line);margin:0 auto;}
  .vt-hbar{position:absolute;top:0;left:calc((100% - 28px)/6);width:calc(66.666% + 9.333px);height:0;border-top:2px solid var(--line);}

  .sec-title{font-size:23px;font-weight:800;margin:26px 0 12px;color:var(--ink);}
  .sec-title small{font-size:14px;font-weight:400;color:#666;}

  /* 流程对比 */
  .flow-wrap{display:flex;gap:18px;align-items:stretch;}
  .flow-left{flex:1.05;border:1.5px solid var(--green);border-radius:6px;padding:10px 12px;background:var(--green-bg);}
  .flow-right{flex:1;border:1.5px solid var(--green);border-radius:6px;padding:10px 12px;background:var(--green-bg);}
  .flabel{font-weight:700;font-size:15px;margin-bottom:6px;}
  .chain{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:14.5px;margin:6px 0;}
  .box{border:1.5px solid var(--line);border-radius:5px;padding:6px 11px;white-space:nowrap;}
  .box.g{background:var(--green-bx);color:#fff;border-color:var(--green-bx);font-weight:700;}
  .arrow{font-weight:800;color:#555;margin:0 2px;}
  .note{font-size:14px;margin-top:8px;}
  .note.g{color:var(--green);font-weight:700;}

  /* 模块对比 */
  .mod-wrap{display:flex;gap:14px;}
  .mod{flex:1;border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;font-size:14.5px;}
  .mod h4{margin:0 0 6px;font-size:17px;font-weight:800;text-align:center;}
  .mod .grp{font-weight:700;margin:8px 0 3px;color:#444;}
  .mod ul{list-style:none;margin:0;padding:0;}
  .mod li{padding:2px 0;}
  .mod li.add{border:1.5px solid var(--green-bx);border-radius:4px;background:var(--green-bg);padding:2px 6px;margin:2px 0;font-weight:700;color:var(--green);}

  /* 细节大表 */
  table{border-collapse:collapse;width:100%;font-size:14px;margin-top:4px;}
  th,td{border:1px solid var(--line);padding:5px 7px;text-align:center;}
  thead th{background:#f1f1f1;font-weight:800;}
  td.l{text-align:left;}
  td.area{background:var(--green-bg);font-weight:800;color:var(--green);}
  tr.key td{background:var(--blue-bg);}
  tr.key td.area{background:var(--green-bg);}
  .y{color:var(--green);font-weight:800;}
  .n{color:#d93025;font-weight:800;}

  /* 与精斗云对比 */
  .vs{list-style:none;counter-reset:v;margin:0;border:1.5px solid var(--green);border-radius:8px;background:var(--green-bg);padding:4px 0;}
  .vs li{counter-increment:v;display:flex;gap:10px;padding:11px 16px;font-size:16px;color:#1f3d2a;border-bottom:1px dashed #b9d8c4;}
  .vs li:last-child{border-bottom:none;}
  .vs li::before{content:counter(v)&quot;.&quot;;font-weight:800;color:var(--green);flex:0 0 auto;}
  .vs li b{color:var(--green);}

  /* 底部承诺 */
  .promise{border-top:2px dashed #bbb;margin-top:24px;padding-top:14px;font-size:14.5px;color:#333;}
  .promise .big{font-size:17px;font-weight:800;color:var(--green);}
  .foot{text-align:center;margin-top:14px;font-size:15px;}
  .foot b{font-size:17px;}

  .panel{display:none;}
  .panel.active{display:block;}

  /* 细节表横向滚动，避免窄屏溢出 */
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:4px;}
  .table-scroll table{min-width:600px;}

  /* ============ 响应式：平板 ============ */
  @media (max-width:768px){
    .page{padding:26px 22px 24px;margin:14px auto;}
    .title{font-size:28px;}
  }

  /* ============ 响应式：手机端 ============ */
  @media (max-width:560px){
    .page{padding:20px 14px 22px;margin:0 auto;border-radius:0;width:100%;}
    .title{font-size:24px;letter-spacing:1px;}

    /* 页签等宽一行铺满（手机端不换行） */
    .tabs{display:flex;flex-direction:row;gap:6px;margin:14px 0 18px;border-bottom:none;}
    .tab{flex:1 1 0;min-width:0;padding:12px 6px;font-size:14px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:8px;border-bottom:3px solid transparent;top:0;}

    /* 版本头卡：三列横排 + 树形连线（与电脑端一致） */
    .ver-head{gap:8px;}
    .ver{padding:7px 4px;}
    .ver .name{font-size:15px;}
    .vt-stem{height:26px;}
    .vt-area{height:22px;}
    .vt-area>span>i{height:20px;margin-top:0;}
    .vt-root{font-size:16px;}

    /* 流程两个框竖排 */
    .flow-wrap{flex-direction:column;gap:12px;}

    /* 模块三列：移动端横向并排，可滑动对比 */
    .mod-wrap{flex-direction:row;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:8px;padding-bottom:6px;}
    .mod{flex:0 0 120px;font-size:12.5px;padding:10px 9px;}
    .mod h4{font-size:14px;}

    .sec-title{font-size:18px;}
    .vs li{font-size:13.5px;padding:9px 12px;}

    /* 底部二维码自适应 */
    .promise img{width:130px !important;height:130px !important;}
